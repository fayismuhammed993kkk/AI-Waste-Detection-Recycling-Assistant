@if(recommendation()){

<section class="recommendation-section">

    <h2>AI Recycling Recommendation</h2>

    <mat-card class="recommendation-card">

        <div class="status-banner">

            <h3>♻️ {{ recommendation().message }}</h3>

        </div>

        <div class="counts">

            <div class="count-box recyclable">

                <h1>{{ recommendation().recyclable_items }}</h1>

                <p>Recyclable</p>

            </div>

            <div class="count-box non-recyclable">

                <h1>{{ recommendation().non_recyclable_items }}</h1>

                <p>Non-Recyclable</p>

            </div>

        </div>

        <h3>Instructions</h3>

        <div class="instruction-list">

            @for(item of recommendation().instructions; track item){

                <div class="instruction">

                    ✅ {{ item }}

                </div>

            }

        </div>

    </mat-card>

</section>

}
